apply plugin: 'com.android.application'

android {
    namespace "com.xenox.short_app"
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.hbx.shortapp"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            def keystorePath = project.findProperty("KEYSTORE_PATH") ?: System.getenv("KEYSTORE_PATH") ?: ""
            def storePass = project.findProperty("STORE_PASSWORD") ?: System.getenv("STORE_PASSWORD") ?: ""
            def keyAliasVal = project.findProperty("KEY_ALIAS") ?: System.getenv("KEY_ALIAS") ?: "xenox"
            def keyPass = project.findProperty("KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD") ?: ""
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword storePass
                keyAlias keyAliasVal
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.core:core:1.12.0'
}
